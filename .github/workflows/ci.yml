name: CI

on:
  push:
  pull_request:

# Keep one run per ref; a newer push cancels an in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck & tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Node 22: required by Vitest 5 / Vite 8 (>= 22.12) and supported by Expo SDK 57
      # (react-native@0.86 engines: ^20.19.4 || ^22.13.0 || ^24.3.0 || >= 25.0.0).
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # package-lock.json is committed, so use the deterministic install.
      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test
